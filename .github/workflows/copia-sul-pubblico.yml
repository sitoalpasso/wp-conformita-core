name: Copia sul repository pubblico

# Lo sviluppo e le revisioni avvengono in una copia privata del repository. Questo flusso
# porta sul repository pubblico tre cose, con la stessa storia:
#
# - il ramo principale, quando una modifica vi entra;
# - le etichette di versione, quando se ne crea una;
# - i rilasci, quando se ne pubblica uno: sul pubblico si crea il rilascio con la stessa
#   etichetta, lo stesso titolo e le stesse note.
#
# Il repository pubblico ha lo stesso nome senza il suffisso "-sviluppo". La scrittura usa
# il segreto TOKEN_REPOSITORIO_PUBBLICO, con permesso di scrittura sui contenuti e sui
# flussi di lavoro del solo repository pubblico.
#
# Il flusso gira solo nella copia privata: nel repository pubblico il file esiste ma non
# parte. Non forza mai: se il ramo pubblico ha commit che la copia privata non ha, o se
# un'etichetta esiste già sul pubblico con un commit diverso, la copia si ferma con errore
# e la differenza si risolve a mano. Un rilascio che esiste già sul pubblico non si tocca.
#
# Un'etichetta passa solo se il suo commit è già nel ramo principale: un'etichetta messa
# su un ramo non unito porterebbe sul pubblico lavoro non revisionato, e la copia si ferma.

on:
  push:
    branches:
      - main
    tags:
      - "**"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

# Un gruppo per riferimento: GitHub tiene in attesa una sola esecuzione per gruppo, e con
# un gruppo unico un'etichetta o un rilascio potrebbero scartare la copia del ramo principale.
concurrency:
  group: copia-sul-pubblico-${{ github.ref }}
  cancel-in-progress: false

jobs:
  copia:
    name: Copia sul pubblico
    if: >-
      github.event.repository.private &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Controlla segreto e nome del repository
        env:
          TOKEN: ${{ secrets.TOKEN_REPOSITORIO_PUBBLICO }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Manca il segreto TOKEN_REPOSITORIO_PUBBLICO."
            exit 1
          fi
          case "$GITHUB_REPOSITORY" in
            *-sviluppo) ;;
            *)
              echo "::error::Il nome del repository non finisce con -sviluppo."
              exit 1
              ;;
          esac
          echo "PUBBLICO=${GITHUB_REPOSITORY%-sviluppo}" >> "$GITHUB_ENV"

      - name: Controlla che l'etichetta sia nel ramo principale
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ETICHETTA: ${{ github.ref_name }}
        run: |
          if ! git rev-parse --verify --quiet origin/main > /dev/null; then
            echo "::error::Il ramo principale non è stato scaricato: impossibile controllare l'etichetta."
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/${ETICHETTA}^{commit}" origin/main; then
            echo "::error::L'etichetta ${ETICHETTA} punta a un commit che non è nel ramo principale: non si copia."
            exit 1
          fi

      - name: Porta il ramo principale
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.TOKEN_REPOSITORIO_PUBBLICO }}
        run: |
          git push "https://x-access-token:${TOKEN}@github.com/${PUBBLICO}.git" HEAD:refs/heads/main

      - name: Porta l'etichetta di versione
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.TOKEN_REPOSITORIO_PUBBLICO }}
          ETICHETTA: ${{ github.ref_name }}
        run: |
          git push "https://x-access-token:${TOKEN}@github.com/${PUBBLICO}.git" "refs/tags/${ETICHETTA}:refs/tags/${ETICHETTA}"

      - name: Crea il rilascio sul pubblico
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.TOKEN_REPOSITORIO_PUBBLICO }}
          ETICHETTA: ${{ github.event.release.tag_name }}
          TITOLO: ${{ github.event.release.name }}
          NOTE: ${{ github.event.release.body }}
          PROVA: ${{ github.event.release.prerelease }}
        run: |
          if gh release view "$ETICHETTA" --repo "$PUBBLICO" > /dev/null 2>&1; then
            echo "Il rilascio ${ETICHETTA} esiste già sul pubblico: non si tocca."
            exit 0
          fi
          printf '%s' "$NOTE" > note-del-rilascio.md
          ARGOMENTI=(--repo "$PUBBLICO" --verify-tag --title "${TITOLO:-$ETICHETTA}" --notes-file note-del-rilascio.md)
          if [ "$PROVA" = "true" ]; then
            ARGOMENTI+=(--prerelease)
          fi
          gh release create "$ETICHETTA" "${ARGOMENTI[@]}"
