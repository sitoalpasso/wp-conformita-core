name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    name: PHPCS (WordPress Coding Standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Installa le dipendenze
        uses: ramsey/composer-install@v3

      - name: Esegui PHPCS
        run: composer lint

  test:
    name: PHPUnit (WordPress ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            wordpress: '6.5'
          - php: '8.3'
            wordpress: 'latest'
    steps:
      - uses: actions/checkout@v4

      - name: Prepara PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Installa le dipendenze PHP
        uses: ramsey/composer-install@v3

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa wp-env
        run: npm install

      - name: Configura l'ambiente della matrice
        run: |
          if [ "${{ matrix.wordpress }}" = "latest" ]; then
            nucleo="null"
          else
            nucleo="\"WordPress/WordPress#${{ matrix.wordpress }}\""
          fi
          cat > .wp-env.override.json <<EOF
          {
            "core": ${nucleo},
            "phpVersion": "${{ matrix.php }}"
          }
          EOF
          cat .wp-env.override.json

      - name: Avvia l'ambiente
        run: npx wp-env start

      - name: Esegui PHPUnit
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/wp-conformita-core vendor/bin/phpunit

      - name: Diagnostica in caso di errore
        if: failure()
        run: npx wp-env logs tests --watch=false

      - name: Ferma l'ambiente
        if: always()
        run: npx wp-env stop

  descrittore:
    name: Validazione publiccode.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valida il descrittore
        uses: italia/publiccode-parser-action@v1
        with:
          publiccode: publiccode.yml
