name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    name: PHPCS (WordPress Coding Standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Installa le dipendenze
        uses: ramsey/composer-install@v3

      - name: Esegui PHPCS
        run: composer lint

  test:
    name: PHPUnit (WordPress ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            wordpress: '6.5'
          - php: '8.3'
            wordpress: 'latest'
    steps:
      - uses: actions/checkout@v4

      - name: Prepara PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Installa le dipendenze PHP
        uses: ramsey/composer-install@v3

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa wp-env
        run: npm install

      - name: Configura l'ambiente della matrice
        run: |
          if [ "${{ matrix.wordpress }}" = "latest" ]; then
            nucleo="null"
          else
            nucleo="\"WordPress/WordPress#${{ matrix.wordpress }}\""
          fi
          cat > .wp-env.override.json <<EOF
          {
            "core": ${nucleo},
            "phpVersion": "${{ matrix.php }}"
          }
          EOF
          cat .wp-env.override.json

      - name: Avvia l'ambiente
        run: npx wp-env start

      - name: Esegui PHPUnit
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/conformita-core vendor/bin/phpunit

      - name: Diagnostica in caso di errore
        if: failure()
        run: npx wp-env logs tests --watch=false

      - name: Ferma l'ambiente
        if: always()
        run: npx wp-env stop

  banca-dati-vecchia:
    name: PHPUnit su MariaDB 5.5 (un solo lucchetto per connessione)
    runs-on: ubuntu-latest
    # Una banca dati che tiene un solo lucchetto per connessione e non conosce
    # RELEASE_ALL_LOCKS: WordPress la ammette ancora. L'ambiente di wp-env non
    # la offre, quindi qui la suite gira su un servizio a parte.
    services:
      mysql:
        image: mariadb:5.5
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Prepara PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: composer

      - name: Installa le dipendenze PHP
        uses: ramsey/composer-install@v3

      - name: Installa subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Prepara la suite di test di WordPress
        run: bin/installa-suite-test.sh wordpress_test root root 127.0.0.1:3306 latest

      - name: Esegui PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: vendor/bin/phpunit

  descrittore:
    name: Validazione publiccode.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valida il descrittore
        uses: italia/publiccode-parser-action@v1
        with:
          publiccode: publiccode.yml
